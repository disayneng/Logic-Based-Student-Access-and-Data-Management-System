<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout Confirmation - Smart Campus Navigation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0c0f1e 0%, #1a1a3e 30%, #2d1b4e 60%, #1a1a3e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(72, 49, 212, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(120, 80, 240, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(72, 49, 212, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Floating particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            animation: float linear infinite;
        }

        .particle:nth-child(1) { width: 300px; height: 300px; top: -100px; right: -100px; animation-duration: 25s; }
        .particle:nth-child(2) { width: 200px; height: 200px; bottom: -50px; left: -50px; animation-duration: 20s; }
        .particle:nth-child(3) { width: 150px; height: 150px; top: 50%; left: 10%; animation-duration: 30s; }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        .logout-modal {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 50px 60px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s ease forwards;
            position: relative;
            z-index: 1;
        }

        .logout-modal .brand {
            margin-bottom: 30px;
        }

        .logout-modal .brand h2 {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .logout-modal .brand h2 i {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: 8px;
        }

        .logout-modal .brand small {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            display: block;
            margin-top: 4px;
            letter-spacing: 2px;
        }

        .logout-modal .icon {
            width: 80px;
            height: 80px;
            background: rgba(231, 76, 60, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 3rem;
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.15);
        }

        .logout-modal h3 {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .logout-modal p {
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .logout-modal .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .logout-modal .btn {
            padding: 12px 35px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .logout-modal .btn-cancel {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.8);
        }

        .logout-modal .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .logout-modal .btn-logout {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #ffffff;
        }

        .logout-modal .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.35);
        }

        .logout-modal .footer {
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Decorative border glow */
        .logout-modal::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), transparent 40%, transparent 60%, rgba(108, 92, 231, 0.1));
            z-index: -1;
            pointer-events: none;
        }

        .logout-modal {
            position: relative;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .logout-modal {
                padding: 35px 25px;
                margin: 20px;
            }

            .logout-modal .btn {
                padding: 10px 20px;
                font-size: 0.85rem;
            }

            .logout-modal .brand h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="logout-modal">

        <div class="icon">
            <i class="bi bi-box-arrow-right"></i>
        </div>
        <h3>Are you sure you want to logout?</h3>
        <p>You will be redirected to the login page.</p>
        
        <div class="btn-group">
            <a href="{{ url_for('dashboard') }}" class="btn btn-cancel">
                <i class="bi bi-arrow-left"></i> Cancel
            </a>
            <form method="POST" action="{{ url_for('logout_do') }}" style="display: inline;">
                <button type="submit" class="btn btn-logout">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </form>
        </div>

        <div class="footer">Secure Smart Campus System · 2026</div>
    </div>
</body>
</html>
