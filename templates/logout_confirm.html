<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout Confirmation - Smart Campus Navigation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- Vercel Speed Insights -->
    <script type="module">
        import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@1/dist/index.mjs';
        injectSpeedInsights();
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            /* Background with BISU image and dark overlay – no particle elements */
            background: linear-gradient(rgba(12, 15, 30, 0.85), rgba(26, 26, 62, 0.85)), 
                        url("{{ url_for('static', filename='images/bisu_background.png') }}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Arial', sans-serif; position: relative; overflow: hidden;
        }

        /* Removed .particle styles and @keyframes float */

        .logout-modal {
            background: rgba(20, 27, 45, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; padding: 50px 60px;
            max-width: 440px; width: 100%; text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.6s ease forwards;
            position: relative; z-index: 1;
        }

        .logout-modal .icon {
            width: 80px; height: 80px; background: rgba(231, 76, 60, 0.15);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; font-size: 3rem; color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .logout-modal h3 { color: #ffffff; font-weight: 700; margin-bottom: 10px; font-size: 1.3rem; }
        .logout-modal p { color: rgba(255, 255, 255, 0.6); margin-bottom: 30px; font-size: 0.9rem; }

        .logout-modal .btn-group { display: flex; gap: 12px; justify-content: center; }
        .logout-modal .btn {
            padding: 12px 35px; border-radius: 12px; font-weight: 600;
            font-size: 0.9rem; transition: all 0.3s ease; border: none;
            text-decoration: none; display: inline-flex; align-items: center;
            gap: 8px; cursor: pointer;
        }

        .logout-modal .btn-cancel { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.8); }
        .logout-modal .btn-cancel:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-2px); color: #ffffff; }

        .logout-modal .btn-logout { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #ffffff; }
        .logout-modal .btn-logout:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4); }

        .logout-modal .footer { margin-top: 25px; color: rgba(255, 255, 255, 0.3); font-size: 0.7rem; letter-spacing: 1px; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logout-modal::before {
            content: ''; position: absolute; top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), transparent 40%, transparent 60%, rgba(108, 92, 231, 0.1));
            z-index: -1; pointer-events: none;
        }

        @media (max-width: 576px) {
            .logout-modal { padding: 35px 25px; margin: 20px; }
            .logout-modal .btn { padding: 10px 20px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <!-- Removed particle divs -->

    <div class="logout-modal">
        <div class="icon">
            <i class="bi bi-box-arrow-right"></i>
        </div>
        <h3>Are you sure you want to logout?</h3>
        <p>You will be redirected to the login page.</p>
        
        <div class="btn-group">
            <a href="{{ url_for('dashboard') }}" class="btn btn-cancel">
                <i class="bi bi-arrow-left"></i> Cancel
            </a>
            <form method="POST" action="{{ url_for('logout_do') }}" style="display: inline;">
                <button type="submit" class="btn btn-logout">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </form>
        </div>

        <div class="footer">Secure Smart Campus System · 2026</div>
    </div>
</body>
</html>
