<!DOCTYPE html>
<html>
<head>
    <title>Request Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h2>Request Access</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Facility</label>
                <select class="form-select" name="facility" required>
                    <option value="">Select facility</option>
                    {% for f in facilities %}
                        <option value="{{ f }}">{{ f }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" name="date" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Start Hour</label>
                <input type="number" class="form-control" name="start_hour" min="8" max="16" required>
            </div>
            <div class="mb-3">
                <label class="form-label">End Hour</label>
                <input type="number" class="form-control" name="end_hour" min="9" max="17" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Purpose</label>
                <textarea class="form-control" name="purpose" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-success">Submit Request</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back</a>
        </form>
    </div>
</body>
</html>
