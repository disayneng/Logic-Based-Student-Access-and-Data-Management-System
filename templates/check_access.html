<!DOCTYPE html>
<html>
<head>
    <title>Check Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h2>Check Access</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Facility</label>
                <select class="form-select" name="facility" required>
                    <option value="">Select facility</option>
                    {% for f in facilities %}
                        <option value="{{ f }}">{{ f }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Check</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back</a>
        </form>
        
        {% if result %}
            <div class="alert alert-{{ 'success' if result.granted else 'danger' }} mt-3">
                <h4>{{ '✅ ACCESS GRANTED' if result.granted else '❌ ACCESS DENIED' }}</h4>
                <p>{{ result.message }}</p>
                <p>Facility: {{ result.facility }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
